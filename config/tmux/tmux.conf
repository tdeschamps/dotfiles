# ~/.config/tmux/tmux.conf  (tmux 3.1+ reads this location natively)

# Terminal type. tmux-256color is the correct terminfo entry; screen-256color
# loses italics and a few capabilities.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,alacritty:Tc,xterm-ghostty:Tc"

# Prefix on Ctrl-Space
set -g prefix C-space
unbind C-b
bind C-space send-prefix

set-window-option -g xterm-keys on
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -sg escape-time 0
set -g set-clipboard on

# Copy mode, vi keys
setw -g mode-keys vi
unbind p
bind p paste-buffer
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# System clipboard. reattach-to-user-namespace has not been needed since
# macOS 10.12; pbcopy works directly inside tmux.
if-shell 'uname | grep -q Darwin' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"; bind y run "tmux save-buffer - | pbcopy"' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i 2>/dev/null || wl-copy"'

# New windows and splits open in the current pane's directory
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Configuration reloaded"

# Status line. Powerline (and its pyenv-pinned path) is gone; this is plain
# tmux formatting with no Python dependency.
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=colour234,fg=colour248"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=colour109,fg=colour234,bold] #S #[bg=colour234,fg=colour109]"
set -g status-right "#[fg=colour243]#{?client_prefix,PREFIX ,}#[fg=colour248]#h #[bg=colour109,fg=colour234,bold] %d %b %H:%M "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=colour237,fg=colour223,bold] #I #W "
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour109"
set -g message-style "bg=colour109,fg=colour234"

# Plugins (tpm)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

# Keep this line at the very bottom of tmux.conf
run '~/.config/tmux/plugins/tpm/tpm'
